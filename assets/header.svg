<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none" role="img" aria-label="Bogdan Tovstenko - AI Engineer, Automation Specialist, Generative AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="55%" stop-color="#0F2027"/>
      <stop offset="100%" stop-color="#1a3556"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="60%" stop-color="#7FD1FF"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#4A90D9" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>

    <clipPath id="frame"><rect width="1000" height="230" rx="14"/></clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .sans { font-family: 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#grid)"/>

    <circle cx="820" cy="70" r="230" fill="url(#glow)"/>

    <g transform="translate(56, 0)">
      <text class="sans" x="0" y="96" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">
        Bogdan Tovstenko
      </text>

      <rect x="0" y="114" width="392" height="2.5" rx="1.25" fill="url(#accent)"/>

      <text class="sans" x="0" y="150" font-size="18" fill="#C9D9EC" letter-spacing="0.4">
        AI Engineer <tspan fill="#4A90D9">&#183;</tspan> Automation Specialist <tspan fill="#4A90D9">&#183;</tspan> Generative AI
      </text>

      <g transform="translate(0,174)">
        <g>
          <rect width="116" height="28" rx="14" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-opacity="0.40"/>
          <text class="mono" x="58" y="18.5" font-size="12" fill="#9EC9F0" text-anchor="middle" letter-spacing="0.6">Python &#183; n8n</text>
        </g>
        <g transform="translate(128,0)">
          <rect width="128" height="28" rx="14" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-opacity="0.40"/>
          <text class="mono" x="64" y="18.5" font-size="12" fill="#9EC9F0" text-anchor="middle" letter-spacing="0.6">LLM pipelines</text>
        </g>
        <g transform="translate(268,0)">
          <rect width="112" height="28" rx="14" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-opacity="0.40"/>
          <text class="mono" x="56" y="18.5" font-size="12" fill="#9EC9F0" text-anchor="middle" letter-spacing="0.6">ComfyUI</text>
        </g>
        <g transform="translate(392,0)">
          <rect width="150" height="28" rx="14" fill="#4A90D9" fill-opacity="0.12" stroke="#4A90D9" stroke-opacity="0.40"/>
          <text class="mono" x="75" y="18.5" font-size="12" fill="#9EC9F0" text-anchor="middle" letter-spacing="0.6">Meta Ads API</text>
        </g>
      </g>
    </g>

    <rect x="0" y="227" width="1000" height="3" fill="url(#accent)" opacity="0.8"/>
  </g>
</svg>
