<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none" role="img" aria-label="Closed marketing loop: Meta Ads API feeds an n8n pipeline joined with internal CRM data, Gemini reasons over it with schema validation, a verdict report reaches the team, and ComfyUI regenerates fatigued creatives back into rotation.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0e1f33"/>
    </linearGradient>
    <linearGradient id="pline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7FD1FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="nodeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17304d"/>
      <stop offset="100%" stop-color="#0f2135"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7FD1FF"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5BD9A6"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A33D"/>
    </marker>
    <clipPath id="pframe"><rect width="1000" height="360" rx="14"/></clipPath>
    <style>
      .m { font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace; }
      .s { font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif; }
      @keyframes dash    { to { stroke-dashoffset: -28; } }
      @keyframes breathe { 0%,100% { opacity:.20 } 50% { opacity:.65 } }
      @keyframes popIn   { from { opacity:0 } to { opacity:1 } }
      .flow { stroke-dasharray: 8 6; animation: dash 1.1s linear infinite; }
      .halo { animation: breathe 2.6s ease-in-out infinite; }
      .n1 { animation: popIn .5s ease both .05s }
      .n2 { animation: popIn .5s ease both .20s }
      .n3 { animation: popIn .5s ease both .35s }
      .n4 { animation: popIn .5s ease both .50s }
      .n5 { animation: popIn .5s ease both .65s }
      .n6 { animation: popIn .5s ease both .80s }
    </style>
  </defs>

  <g clip-path="url(#pframe)">
    <rect width="1000" height="360" fill="url(#pbg)"/>
    <rect x="0.5" y="0.5" width="999" height="359" fill="none" stroke="#4A90D9" stroke-opacity="0.25" rx="14"/>

    <text class="m" x="28" y="36" font-size="13" fill="#4A90D9" letter-spacing="3">CLOSED MARKETING LOOP</text>
    <text class="m" x="972" y="36" font-size="12" fill="#5d7fa5" text-anchor="end" letter-spacing="1.5">runs daily · unattended</text>

    <!-- ═══ forward connections ═══ -->
    <g stroke="url(#pline)" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
      <path class="flow" d="M 174 150 H 230"/>
      <path class="flow" d="M 372 150 H 428"/>
      <path class="flow" d="M 570 150 H 626"/>
      <path class="flow" d="M 768 150 H 824"/>
    </g>

    <!-- CRM joins the pipeline -->
    <path class="flow" d="M 302 232 V 184" stroke="#4A90D9" stroke-opacity="0.6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- schema validation retry loop -->
    <path class="flow" d="M 560 116 C 574 86, 506 86, 520 116" stroke="#E8A33D" stroke-opacity="0.85" stroke-width="2" fill="none" marker-end="url(#arrowO)"/>
    <text class="m" x="500" y="74" font-size="11" fill="#E8A33D" text-anchor="middle" letter-spacing="0.8">schema invalid → re-prompt</text>

    <!-- creative regeneration feedback -->
    <path class="flow" d="M 896 182 V 316 H 104 V 184" stroke="#5BD9A6" stroke-opacity="0.75" stroke-width="2.4" fill="none" marker-end="url(#arrowG)"/>
    <text class="m" x="500" y="338" font-size="11.5" fill="#5BD9A6" text-anchor="middle" letter-spacing="1.2">fatigued creative → regenerate → back into rotation</text>

    <!-- ═══ travelling packets ═══ -->
    <g fill="#BFE6FF">
      <circle r="3.6"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 174 150 H 230"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle r="3.6"><animateMotion dur="2.2s" begin="0.55s" repeatCount="indefinite" path="M 372 150 H 428"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.55s" repeatCount="indefinite"/></circle>
      <circle r="3.6"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 570 150 H 626"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle r="3.6"><animateMotion dur="2.2s" begin="1.65s" repeatCount="indefinite" path="M 768 150 H 824"/><animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.65s" repeatCount="indefinite"/></circle>
    </g>
    <circle r="3.4" fill="#4A90D9">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 302 232 V 184"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.2" fill="#5BD9A6">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M 896 182 V 316 H 104 V 184"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ═══ nodes ═══ -->
    <g class="n1">
      <circle cx="104" cy="150" r="88" fill="url(#pglow)" class="halo"/>
      <rect x="34" y="120" width="140" height="60" rx="11" fill="url(#nodeg)" stroke="#4A90D9" stroke-opacity="0.7"/>
      <text class="s" x="104" y="145" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Meta Ads API</text>
      <text class="m" x="104" y="164" font-size="9.5" fill="#8FB6DB" text-anchor="middle">campaign · adset · ad</text>
      <text class="m" x="34" y="110" font-size="10" fill="#4A90D9" letter-spacing="1.4">01 COLLECT</text>
    </g>

    <g class="n2">
      <circle cx="302" cy="150" r="88" fill="url(#pglow)" class="halo"/>
      <rect x="232" y="120" width="140" height="60" rx="11" fill="url(#nodeg)" stroke="#EA4B71" stroke-opacity="0.7"/>
      <text class="s" x="302" y="145" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">n8n pipeline</text>
      <text class="m" x="302" y="164" font-size="9.5" fill="#E39AAE" text-anchor="middle">normalise · fatigue · pacing</text>
      <text class="m" x="232" y="110" font-size="10" fill="#EA4B71" letter-spacing="1.4">02 PROCESS</text>
    </g>

    <g class="n3">
      <circle cx="500" cy="150" r="88" fill="url(#pglow)" class="halo"/>
      <rect x="430" y="120" width="140" height="60" rx="11" fill="url(#nodeg)" stroke="#7FD1FF" stroke-opacity="0.85"/>
      <text class="s" x="500" y="145" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gemini</text>
      <text class="m" x="500" y="164" font-size="9.5" fill="#9EC9F0" text-anchor="middle">multimodal · JSON verdict</text>
      <text class="m" x="430" y="110" font-size="10" fill="#7FD1FF" letter-spacing="1.4">03 REASON</text>
      <circle cx="556" cy="134" r="3.5" fill="#7FD1FF">
        <animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g class="n4">
      <circle cx="698" cy="150" r="88" fill="url(#pglow)" class="halo"/>
      <rect x="628" y="120" width="140" height="60" rx="11" fill="url(#nodeg)" stroke="#4A90D9" stroke-opacity="0.7"/>
      <text class="s" x="698" y="145" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Report → team</text>
      <text class="m" x="698" y="164" font-size="9.5" fill="#8FB6DB" text-anchor="middle">scale · hold · pause</text>
      <text class="m" x="628" y="110" font-size="10" fill="#4A90D9" letter-spacing="1.4">04 DECIDE</text>
    </g>

    <g class="n5">
      <circle cx="896" cy="150" r="88" fill="url(#pglow)" class="halo"/>
      <rect x="826" y="120" width="140" height="60" rx="11" fill="url(#nodeg)" stroke="#5BD9A6" stroke-opacity="0.75"/>
      <text class="s" x="896" y="145" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">ComfyUI</text>
      <text class="m" x="896" y="164" font-size="9.5" fill="#93E0C2" text-anchor="middle">SDXL · FLUX · LoRA</text>
      <text class="m" x="826" y="110" font-size="10" fill="#5BD9A6" letter-spacing="1.4">05 REGENERATE</text>
    </g>

    <g class="n6">
      <rect x="232" y="232" width="140" height="46" rx="11" fill="#12283f" stroke="#4A90D9" stroke-opacity="0.45" stroke-dasharray="4 3"/>
      <text class="s" x="302" y="251" font-size="12.5" font-weight="600" fill="#D7E7F7" text-anchor="middle">internal CRM</text>
      <text class="m" x="302" y="268" font-size="9" fill="#7FA5C9" text-anchor="middle">SQL · real enrolments</text>
    </g>
  </g>
</svg>
